# Copies a published release's setup program and SHA256SUMS.txt to the mirror at
# gitee.com/helloyork_9429/AnimeLogon, for people who download from Gitee more easily than from
# GitHub. The mirror carries the installers only, never the source code; its README points here.
#
# It runs when a release is published (release.yml makes drafts, which are published by hand) and
# can be run again by hand for any tag. It needs a Gitee personal access token with the "projects"
# scope in the repository secret GITEE_TOKEN; without one it says so and does nothing. Running it
# twice for the same tag reuses the Gitee release and skips files already attached to it.
name: Gitee mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to copy, such as v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: gitee-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_API: https://gitee.com/api/v5/repos/helloyork_9429/AnimeLogon
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Copy the release to Gitee
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::The repository secret GITEE_TOKEN is not set, so $TAG was not copied to Gitee."
            exit 0
          fi

          # The setup program and the checksum list, the same files as on GitHub. The list's line
          # endings are Windows ones, written by release.yml on a Windows runner.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D assets -p '*-setup.exe' -p 'SHA256SUMS.txt'
          setup=$(cd assets && ls -- *-setup.exe)
          want=$(tr -d '\r' < assets/SHA256SUMS.txt | awk -v f="$setup" '$2 == f { print tolower($1) }')
          have=$(sha256sum "assets/$setup" | cut -d' ' -f1)
          if [ -z "$want" ] || [ "$want" != "$have" ]; then
            echo "::error::$setup does not match its line in SHA256SUMS.txt (listed: '$want', downloaded: $have)"
            exit 1
          fi

          # Reuse the Gitee release for this tag if an earlier run made it; Gitee makes the tag on
          # the mirror's default branch when it creates the release.
          id=$(curl -s "$GITEE_API/releases/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty' 2>/dev/null || true)
          if [ -z "$id" ]; then
            prerelease=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
            notes=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)
            body=$(printf '%s\n\n---\n\n源代码和完整的发布说明见 GitHub：https://github.com/%s/releases/tag/%s\n' "$notes" "$GITHUB_REPOSITORY" "$TAG")
            id=$(curl -sf -X POST "$GITEE_API/releases" \
              --form-string "access_token=$GITEE_TOKEN" \
              --form-string "tag_name=$TAG" \
              --form-string "name=AnimeLogon ${TAG#v}" \
              --form-string "body=$body" \
              --form-string "prerelease=$prerelease" \
              --form-string "target_commitish=master" | jq -r '.id')
            echo "Made Gitee release $id for $TAG"
          else
            echo "Gitee release $id for $TAG is already there"
          fi

          attached=$(curl -sf "$GITEE_API/releases/$id/attach_files?access_token=$GITEE_TOKEN&per_page=100" | jq -r '.[].name')
          for f in "$setup" SHA256SUMS.txt; do
            if grep -qxF -- "$f" <<< "$attached"; then
              echo "$f is already attached"
              continue
            fi
            curl -sf -X POST "$GITEE_API/releases/$id/attach_files" \
              --form-string "access_token=$GITEE_TOKEN" \
              -F "file=@assets/$f" > /dev/null
            echo "Attached $f"
          done
          echo "https://gitee.com/helloyork_9429/AnimeLogon/releases/tag/$TAG"
