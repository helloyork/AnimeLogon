name: Release

# Pushing a tag such as v1.0.0 or v1.1.0-beta1 builds ARM64 and x64 and attaches the one setup
# program, which installs either, to a draft GitHub release. The draft is published by hand once its
# files have been checked.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Two builds one after the other; anything stuck is ended well before GitHub's six hours.
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # The settings app's page is bundled with esbuild (app/web).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      # v1.1.0-beta1 is version 1.1.0 with the suffix -beta1. The numbers must be the ones in
      # CMakeLists.txt, so that a tag cannot ship programs that carry another version.
      - name: Read the version from the tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.]+)?$') {
            throw "Tag $env:TAG is not v<major>.<minor>.<patch> with an optional -<suffix>"
          }
          $numbers = $Matches[1]
          $suffix = "$($Matches[2])"
          $project = (Select-String -Path CMakeLists.txt -Pattern 'project\(AnimeLogon VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if ($project -ne $numbers) { throw "Tag $env:TAG does not match version $project in CMakeLists.txt" }
          "VERSION=$numbers$suffix" >> $env:GITHUB_ENV
          "SUFFIX=$suffix" >> $env:GITHUB_ENV
          "PRERELEASE=$(if ($suffix) { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      # ARM64 first: the x64 build's install.exe carries the ARM64 programs as well as its own and
      # installs whichever the machine runs (installer/CMakeLists.txt). Tags are made on master,
      # whose commits the Build workflow has already built and tested, so the tests and tools are
      # left out here.
      - name: Build
        shell: pwsh
        run: |
          $common = @('-DBUILD_TESTING=OFF', "-DANIMELOGON_BUILD=${{ github.run_number }}", "-DANIMELOGON_VERSION_SUFFIX=$env:SUFFIX")
          cmake --preset arm64 @common
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset arm64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $arm64 = (Resolve-Path build/arm64/bin/Release).Path
          cmake --preset x64 @common "-DANIMELOGON_ARM64_PAYLOAD_DIR=$arm64"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # One setup program: install.exe carries every file it installs for both architectures, the
      # licences included. Beside it, the programs' symbols of both architectures in one zip, so
      # that anyone can read a crash reported against this release; the project is open source,
      # so they are published with it. The log lists every file's SHA-256, as SHA256SUMS.txt does.
      - name: Package
        shell: pwsh
        run: |
          $dist = (New-Item -ItemType Directory -Force dist).FullName
          Copy-Item build/x64/bin/Release/install.exe (Join-Path $dist "AnimeLogon-$env:VERSION-setup.exe") -ErrorAction Stop
          foreach ($arch in 'x64', 'arm64') {
            $to = (New-Item -ItemType Directory -Force "symbols/$arch").FullName
            Copy-Item "build/$arch/bin/Release/*.pdb" $to -ErrorAction Stop
          }
          Compress-Archive -Path symbols/* -DestinationPath (Join-Path $dist "AnimeLogon-$env:VERSION-symbols.zip") -ErrorAction Stop
          Get-ChildItem $dist -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content (Join-Path $dist SHA256SUMS.txt)
          Get-Content (Join-Path $dist SHA256SUMS.txt)

      # A draft, so that its files can be checked and its notes written before anyone sees it.
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--draft', '--verify-tag', '--title', "AnimeLogon $env:VERSION", '--notes', "AnimeLogon $env:VERSION")
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG @flags (Get-ChildItem dist).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
